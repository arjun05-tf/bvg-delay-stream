name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Producer and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'producer[dev]' 'psycopg[binary]>=3.2,<4'

      - name: Generate protobuf bindings
        run: |
          mkdir -p producer/src/bvg_producer/generated/delay/v1
          python -m grpc_tools.protoc -Iproto \
            --python_out=producer/src/bvg_producer/generated \
            --pyi_out=producer/src/bvg_producer/generated \
            proto/delay/v1/stop_event.proto
          for dir in producer/src/bvg_producer/generated \
                     producer/src/bvg_producer/generated/delay \
                     producer/src/bvg_producer/generated/delay/v1; do
            echo '"""Generated protobuf modules."""' > "$dir/__init__.py"
          done

      - name: Lint
        run: ruff check producer/src producer/tests tools

      - name: Type check
        run: mypy producer/src

      - name: Test
        run: pytest producer/tests -q

  java:
    name: Flink job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B -f flink-job/pom.xml verify

      - name: Upload job jar
        uses: actions/upload-artifact@v4
        with:
          name: delay-pipeline-jar
          path: flink-job/target/delay-pipeline-*.jar
          if-no-files-found: error

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env
          docker compose config -q
