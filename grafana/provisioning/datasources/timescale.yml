apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescale
    access: proxy
    url: ${PG_HOST}
    database: ${PG_DB}
    user: ${PG_USER}
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: true
    editable: false
