[project]
name = "bvg-producer"
version = "1.0.0"
description = "Polls the VBB GTFS-Realtime feed and publishes StopEvent protobuf messages to Kafka."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "protobuf>=5.27,<7",
    "gtfs-realtime-bindings>=1.0.0,<2",
    "confluent-kafka[protobuf,schemaregistry]>=2.5,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "grpcio-tools>=1.60",
]

[project.scripts]
bvg-producer = "bvg_producer.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must keep the argument names of the interface they stand in
# for, even where the double ignores them.
"tests/**" = ["ARG002", "ARG001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = "generated"
